<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Cash Wallet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.js"></script>
<title>Cash Wallet</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0f0e0c;
    --surface: #1a1916;
    --surface2: #252320;
    --border: #2e2c28;
    --green: #b8f5a0;
    --green-dim: #3d5235;
    --red: #f5a0a0;
    --red-dim: #52352e;
    --gold: #f5d87a;
    --gold-dim: #4a3e1a;
    --text: #f0ece4;
    --text-muted: #7a7670;
    --text-faint: #3d3b37;
    --radius: 16px;
    --radius-sm: 10px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Outfit', sans-serif;
    min-height: 100vh;
    min-height: -webkit-fill-available;
    display: flex;
    flex-direction: column;
    overflow-x: hidden;
  }

  /* Grain overlay */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
    pointer-events: none;
    z-index: 1000;
    opacity: 0.5;
  }

  .app {
    max-width: 430px;
    margin: 0 auto;
    width: 100%;
    flex: 1;
    display: flex;
    flex-direction: column;
    padding: 0 0 40px;
  }

  /* Header */
  .header {
    padding: 56px 24px 0;
    animation: fadeUp 0.5s ease both;
  }

  .header-label {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.15em;
    color: var(--text-muted);
    text-transform: uppercase;
    margin-bottom: 6px;
  }

  .header-title {
    font-size: 28px;
    font-weight: 800;
    letter-spacing: -0.02em;
    color: var(--text);
  }

  /* Balance card */
  .balance-card {
    margin: 24px 16px 0;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 28px 28px 24px;
    position: relative;
    overflow: hidden;
    animation: fadeUp 0.5s 0.1s ease both;
  }

  .balance-card::after {
    content: '';
    position: absolute;
    top: -40px;
    right: -40px;
    width: 160px;
    height: 160px;
    background: radial-gradient(circle, rgba(245,216,122,0.07) 0%, transparent 70%);
    pointer-events: none;
  }

  .balance-label {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.12em;
    color: var(--text-muted);
    text-transform: uppercase;
    margin-bottom: 12px;
  }

  .balance-amount {
    font-size: 52px;
    font-weight: 800;
    letter-spacing: -0.03em;
    color: var(--gold);
    line-height: 1;
    transition: all 0.3s ease;
  }

  .balance-amount.negative { color: var(--red); }

  .balance-currency {
    font-size: 24px;
    font-weight: 400;
    opacity: 0.6;
    margin-right: 4px;
  }

  .balance-stats {
    display: flex;
    gap: 20px;
    margin-top: 20px;
    padding-top: 20px;
    border-top: 1px solid var(--border);
  }

  .stat {
    flex: 1;
  }

  .stat-label {
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.1em;
    color: var(--text-muted);
    text-transform: uppercase;
    margin-bottom: 4px;
  }

  .stat-value {
    font-size: 15px;
    font-weight: 600;
  }

  .stat-value.in { color: var(--green); }
  .stat-value.out { color: var(--red); }

  /* Action buttons */
  .actions {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin: 16px 16px 0;
    animation: fadeUp 0.5s 0.2s ease both;
  }

  .btn {
    border: none;
    border-radius: var(--radius);
    padding: 20px 16px;
    font-family: 'Outfit', sans-serif;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 10px;
    transition: transform 0.15s ease, opacity 0.15s ease;
    position: relative;
    overflow: hidden;
  }

  .btn:active { transform: scale(0.96); opacity: 0.9; }

  .btn-in {
    background: var(--green-dim);
    color: var(--green);
    border: 1px solid rgba(184,245,160,0.2);
  }

  .btn-out {
    background: var(--red-dim);
    color: var(--red);
    border: 1px solid rgba(245,160,160,0.2);
  }

  .btn-icon {
    font-size: 20px;
    line-height: 1;
  }

  .btn-text {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 1px;
  }

  .btn-sub {
    font-size: 11px;
    font-weight: 400;
    opacity: 0.6;
    font-family: 'DM Mono', monospace;
    letter-spacing: 0.05em;
  }

  /* Transaction log */
  .log-section {
    margin: 24px 16px 0;
    animation: fadeUp 0.5s 0.3s ease both;
    flex: 1;
  }

  .log-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
  }

  .log-title {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.12em;
    color: var(--text-muted);
    text-transform: uppercase;
  }

  .btn-export {
    background: none;
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text-muted);
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.08em;
    padding: 5px 10px;
    cursor: pointer;
    transition: all 0.15s ease;
  }

  .btn-export:active { background: var(--surface); color: var(--text); }

  .log-empty {
    text-align: center;
    padding: 40px 0;
    color: var(--text-faint);
    font-family: 'DM Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.08em;
  }

  .log-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .log-item-wrap {
    position: relative;
    border-radius: var(--radius-sm);
    overflow: hidden;
    animation: fadeUp 0.3s ease both;
  }

  .log-item-delete-bg {
    position: absolute;
    inset: 0;
    background: var(--red-dim);
    display: flex;
    align-items: center;
    justify-content: flex-end;
    padding-right: 20px;
    color: var(--red);
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.05em;
    gap: 6px;
  }

  .log-item {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 14px 16px;
    display: flex;
    align-items: center;
    gap: 12px;
    position: relative;
    touch-action: pan-y;
    transition: transform 0.2s ease;
    will-change: transform;
  }

  .log-item.swiping {
    transition: none;
  }

  .log-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  .log-dot.in { background: var(--green); }
  .log-dot.out { background: var(--red); }

  .log-info {
    flex: 1;
    min-width: 0;
  }

  .log-type {
    font-size: 13px;
    font-weight: 600;
    margin-bottom: 2px;
  }

  .log-date {
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    color: var(--text-muted);
    letter-spacing: 0.05em;
  }

  .log-note {
    font-size: 11px;
    color: var(--text-muted);
    margin-top: 2px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .log-amount {
    font-family: 'DM Mono', monospace;
    font-size: 14px;
    font-weight: 500;
    flex-shrink: 0;
  }

  .log-amount.in { color: var(--green); }
  .log-amount.out { color: var(--red); }

  .log-delete-btn {
    background: none;
    border: none;
    color: var(--text-faint);
    cursor: pointer;
    padding: 6px 8px;
    border-radius: 6px;
    flex-shrink: 0;
    font-size: 18px;
    line-height: 1;
    transition: color 0.15s, background 0.15s;
  }

  .log-delete-btn:active { color: var(--red); background: var(--red-dim); }

  .log-edit-btn {
    background: none;
    border: none;
    color: var(--text-faint);
    cursor: pointer;
    padding: 6px 8px;
    border-radius: 6px;
    flex-shrink: 0;
    font-size: 15px;
    line-height: 1;
    transition: color 0.15s, background 0.15s;
  }

  .log-edit-btn:active { color: var(--gold); background: var(--gold-dim); }

  .delete-sheet {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.7);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    z-index: 200;
    display: flex;
    align-items: flex-end;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s ease;
  }

  .delete-sheet.open { opacity: 1; pointer-events: all; }

  .delete-sheet-inner {
    width: 100%;
    max-width: 430px;
    margin: 0 auto;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 24px 24px 0 0;
    padding: 24px 24px 48px;
    transform: translateY(100%);
    transition: transform 0.28s cubic-bezier(0.34, 1.1, 0.64, 1);
  }

  .delete-sheet.open .delete-sheet-inner { transform: translateY(0); }

  .delete-tx-preview {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 14px 16px;
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 24px;
  }

  .btn-delete-confirm {
    width: 100%;
    border: 1px solid rgba(245,160,160,0.2);
    border-radius: var(--radius);
    padding: 18px;
    font-family: 'Outfit', sans-serif;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    background: var(--red-dim);
    color: var(--red);
    transition: transform 0.15s ease;
    margin-bottom: 4px;
  }

  .btn-delete-confirm:active { transform: scale(0.98); }

  /* Modal overlay */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.7);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    z-index: 100;
    display: flex;
    align-items: flex-end;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s ease;
  }

  .modal-overlay.open {
    opacity: 1;
    pointer-events: all;
  }

  .modal {
    width: 100%;
    max-width: 430px;
    margin: 0 auto;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 24px 24px 0 0;
    padding: 24px 24px 48px;
    transform: translateY(100%);
    transition: transform 0.3s cubic-bezier(0.34, 1.2, 0.64, 1);
  }

  .modal-overlay.open .modal {
    transform: translateY(0);
  }

  .modal-handle {
    width: 36px;
    height: 4px;
    background: var(--border);
    border-radius: 2px;
    margin: 0 auto 24px;
  }

  .modal-title {
    font-size: 22px;
    font-weight: 800;
    letter-spacing: -0.02em;
    margin-bottom: 6px;
  }

  .modal-title.in { color: var(--green); }
  .modal-title.out { color: var(--red); }

  .modal-balance {
    font-family: 'DM Mono', monospace;
    font-size: 12px;
    color: var(--text-muted);
    margin-bottom: 28px;
  }

  .input-group {
    margin-bottom: 16px;
  }

  .input-label {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.1em;
    color: var(--text-muted);
    text-transform: uppercase;
    margin-bottom: 8px;
    display: block;
  }

  .input-wrap {
    position: relative;
    display: flex;
    align-items: center;
  }

  .input-prefix {
    position: absolute;
    left: 16px;
    font-size: 20px;
    font-weight: 600;
    color: var(--text-muted);
    pointer-events: none;
  }

  input[type="number"], input[type="text"] {
    width: 100%;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    color: var(--text);
    font-family: 'DM Mono', monospace;
    font-size: 24px;
    font-weight: 500;
    padding: 16px 16px 16px 36px;
    outline: none;
    transition: border-color 0.15s ease;
    -webkit-appearance: none;
  }

  input[type="text"] {
    font-size: 16px;
    padding-left: 16px;
  }

  input[type="number"]:focus, input[type="text"]:focus {
    border-color: var(--gold);
  }

  input[type="number"]::-webkit-inner-spin-button { display: none; }

  .btn-confirm {
    width: 100%;
    border: none;
    border-radius: var(--radius);
    padding: 18px;
    font-family: 'Outfit', sans-serif;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    margin-top: 8px;
    transition: transform 0.15s ease;
  }

  .btn-confirm:active { transform: scale(0.98); }
  .btn-confirm.in { background: var(--green); color: #0f1a0a; }
  .btn-confirm.out { background: var(--red); color: #1a0a0a; }

  .btn-cancel {
    width: 100%;
    background: none;
    border: none;
    color: var(--text-muted);
    font-family: 'Outfit', sans-serif;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    padding: 14px;
    margin-top: 4px;
  }

  /* Flash feedback */
  .flash {
    position: fixed;
    top: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(-80px);
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 40px;
    padding: 12px 20px;
    font-size: 14px;
    font-weight: 600;
    z-index: 200;
    transition: transform 0.35s cubic-bezier(0.34, 1.4, 0.64, 1);
    white-space: nowrap;
    max-width: 90vw;
  }

  .flash.show { transform: translateX(-50%) translateY(0); }
  .flash.in { color: var(--green); border-color: rgba(184,245,160,0.3); }
  .flash.out { color: var(--red); border-color: rgba(245,160,160,0.3); }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(16px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* Scrollable log */
  .log-scroll {
    max-height: 320px;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
  }

  .log-scroll::-webkit-scrollbar { display: none; }
</style>
</head>
<body>

<!-- ══ LOGIN ══ -->
<div id="viewLogin" style="display:none;min-height:100vh;flex-direction:column;align-items:center;justify-content:center;padding:40px 24px;max-width:430px;margin:0 auto">
  <div style="font-size:28px;font-weight:800;letter-spacing:-0.02em;margin-bottom:6px;font-family:'Outfit',sans-serif;color:var(--text)">Cash Wallet</div>
  <div style="font-family:'DM Mono',monospace;font-size:11px;color:var(--text-muted);letter-spacing:0.1em;margin-bottom:48px">YOUR CASH TRACKER</div>
  <div style="width:100%">
    <div style="margin-bottom:16px">
      <div style="font-family:'DM Mono',monospace;font-size:11px;letter-spacing:0.1em;color:var(--text-muted);text-transform:uppercase;margin-bottom:8px">Email</div>
      <input type="text" id="loginEmail" placeholder="your@email.com" autocomplete="email" style="width:100%;background:var(--surface);border:1px solid var(--border);border-radius:10px;color:var(--text);font-family:'Outfit',sans-serif;font-size:16px;padding:14px 16px;outline:none;-webkit-appearance:none;box-sizing:border-box">
    </div>
    <div style="margin-bottom:16px">
      <div style="font-family:'DM Mono',monospace;font-size:11px;letter-spacing:0.1em;color:var(--text-muted);text-transform:uppercase;margin-bottom:8px">Password</div>
      <input type="password" id="loginPassword" placeholder="••••••••" autocomplete="current-password" style="width:100%;background:var(--surface);border:1px solid var(--border);border-radius:10px;color:var(--text);font-family:'Outfit',sans-serif;font-size:16px;padding:14px 16px;outline:none;-webkit-appearance:none;box-sizing:border-box">
    </div>
    <div id="loginError" style="color:#f5a0a0;font-size:13px;font-family:'DM Mono',monospace;margin-bottom:12px;display:none"></div>
    <button id="loginBtn" onclick="doLogin()" style="width:100%;border:none;border-radius:16px;padding:18px;font-family:'Outfit',sans-serif;font-size:16px;font-weight:700;cursor:pointer;background:#f5d87a;color:#1a1200;margin-top:8px">Sign in</button>
  </div>
</div>

<div class="app" id="viewApp" style="display:none">
  <div class="header">
    <div class="header-label">My Wallet</div>
    <div style="display:flex;align-items:center;justify-content:space-between">
      <div class="header-title">Cash Tracker</div>
      <button onclick="doLogout()" title="Sign out" style="width:34px;height:34px;border-radius:50%;background:var(--surface2);border:1px solid var(--border);color:var(--text-muted);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all 0.15s;flex-shrink:0"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v9"/><path d="M6.4 5.4a9 9 0 1 0 11.2 0"/></svg></button>
    </div>
  </div>

  <div class="balance-card">
    <div class="balance-label">Current Balance</div>
    <div class="balance-amount" id="balanceDisplay">
      <span class="balance-currency">€</span><span id="balanceValue">0.00</span>
    </div>
    <div class="balance-stats">
      <div class="stat">
        <div class="stat-label">Total In</div>
        <div class="stat-value in" id="totalIn">€0.00</div>
      </div>
      <div class="stat">
        <div class="stat-label">Total Out</div>
        <div class="stat-value out" id="totalOut">€0.00</div>
      </div>
      <div class="stat">
        <div class="stat-label">Transactions</div>
        <div class="stat-value" id="txCount" style="color:var(--text-muted)">0</div>
      </div>
    </div>
  </div>

  <div class="actions">
    <button class="btn btn-in" onclick="openModal('in')">
      <span class="btn-icon">＋</span>
      <span class="btn-text">
        <span>Cash In</span>
        <span class="btn-sub">received</span>
      </span>
    </button>
    <button class="btn btn-out" onclick="openModal('out')">
      <span class="btn-icon">－</span>
      <span class="btn-text">
        <span>Cash Out</span>
        <span class="btn-sub">spent</span>
      </span>
    </button>
  </div>

  <div class="log-section">
    <div class="log-header">
      <span class="log-title">Recent Transactions</span>
      <button class="btn-export" onclick="exportCSV()">Export CSV</button>
    </div>
    <div class="log-scroll">
      <div class="log-list" id="logList">
        <div class="log-empty">No transactions yet</div>
      </div>
    </div>
  </div>
</div>

<!-- Modal -->
<div class="modal-overlay" id="modalOverlay" onclick="handleOverlayClick(event)">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-title" id="modalTitle">Cash In</div>
    <div class="modal-balance" id="modalBalance">Current balance: €0.00</div>

    <div class="input-group">
      <label class="input-label">Amount</label>
      <div class="input-wrap">
        <span class="input-prefix">€</span>
        <input type="number" id="amountInput" placeholder="0.00" min="0" step="0.01" inputmode="decimal">
      </div>
    </div>

    <div class="input-group">
      <label class="input-label">Note (optional)</label>
      <div class="input-wrap">
        <input type="text" id="noteInput" placeholder="e.g. ATM withdrawal, lunch…">
      </div>
    </div>

    <button class="btn-confirm in" id="confirmBtn" onclick="confirm()">Log Cash In</button>
    <button class="btn-cancel" onclick="closeModal()">Cancel</button>
  </div>
</div>

<!-- Delete confirmation sheet -->
<div class="delete-sheet" id="deleteSheet" onclick="handleDeleteOverlayClick(event)">
  <div class="delete-sheet-inner">
    <div class="modal-handle"></div>
    <div class="modal-title" style="color:var(--red); margin-bottom:6px;">Delete transaction?</div>
    <div class="modal-balance" style="margin-bottom:20px;">This cannot be undone.</div>
    <div class="delete-tx-preview" id="deletePreview"></div>
    <button class="btn-delete-confirm" onclick="confirmDelete()">Delete transaction</button>
    <button class="btn-cancel" onclick="closeDeleteSheet()">Cancel</button>
  </div>
</div>

<!-- Edit transaction sheet -->
<div class="delete-sheet" id="editSheet" onclick="handleEditOverlayClick(event)">
  <div class="delete-sheet-inner">
    <div class="modal-handle"></div>
    <div class="modal-title" style="color:var(--gold); margin-bottom:28px;">Edit transaction</div>

    <div class="input-group">
      <label class="input-label">Type</label>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
        <button id="editTypeIn" onclick="setEditType('in')" style="padding:12px;border-radius:var(--radius-sm);border:1px solid rgba(184,245,160,0.2);background:var(--green-dim);color:var(--green);font-family:'Outfit',sans-serif;font-size:14px;font-weight:700;cursor:pointer">+ Cash In</button>
        <button id="editTypeOut" onclick="setEditType('out')" style="padding:12px;border-radius:var(--radius-sm);border:1px solid rgba(245,160,160,0.2);background:var(--red-dim);color:var(--red);font-family:'Outfit',sans-serif;font-size:14px;font-weight:700;cursor:pointer">- Cash Out</button>
      </div>
    </div>

    <div class="input-group">
      <label class="input-label">Amount</label>
      <div class="input-wrap">
        <span class="input-prefix">€</span>
        <input type="number" id="editAmountInput" placeholder="0.00" min="0" step="0.01" inputmode="decimal">
      </div>
    </div>

    <div class="input-group">
      <label class="input-label">Note (optional)</label>
      <div class="input-wrap">
        <input type="text" id="editNoteInput" placeholder="e.g. ATM withdrawal, lunch…">
      </div>
    </div>

    <button class="btn-delete-confirm" style="background:var(--gold-dim);color:var(--gold);border-color:rgba(245,216,122,0.2);margin-bottom:4px" onclick="confirmEdit()">Save changes</button>
    <button class="btn-cancel" onclick="closeEditSheet()">Cancel</button>
  </div>
</div>

<!-- Flash message -->
<div class="flash" id="flash"></div>

<script>
  // ── SUPABASE ──
  const SUPA_URL = 'https://nhodhuaugqoyxiyopxhn.supabase.co';
  const SUPA_KEY = 'sb_publishable_tb7aTzOD4vAbmwnIBqH_tQ_NnrI7uBA';
  const supa = supabase.createClient(SUPA_URL, SUPA_KEY);

  let currentType = 'in';
  let data = { transactions: [] };

  // ── AUTH ──
  async function doLogin() {
    const email = document.getElementById('loginEmail').value.trim();
    const password = document.getElementById('loginPassword').value;
    const btn = document.getElementById('loginBtn');
    const err = document.getElementById('loginError');
    err.style.display = 'none';
    btn.textContent = 'Signing in…';
    btn.disabled = true;
    const { data: authData, error } = await supa.auth.signInWithPassword({ email, password });
    btn.textContent = 'Sign in';
    btn.disabled = false;
    if (error) {
      err.textContent = error.message;
      err.style.display = 'block';
    }
  }

  async function doLogout() {
    await supa.auth.signOut();
    document.getElementById('viewApp').style.display = 'none';
    document.getElementById('viewLogin').style.display = 'flex';
    data = { transactions: [] };
  }

  // ── DATA ──
  async function load() {
    const { data: { user } } = await supa.auth.getUser();
    if (!user) return;
    const { data: rows, error } = await supa
      .from('transactions')
      .select('*')
      .order('date', { ascending: true });
    if (error) { showFlash('⚠️ Error loading data', 'out'); return; }
    data.transactions = (rows || []).map(r => ({
      id: r.id,
      type: r.type,
      amount: parseFloat(r.amount),
      note: r.note || '',
      date: r.date
    }));
    render();
  }

  async function save(tx) {
    const { data: { user } } = await supa.auth.getUser();
    if (!user) return;
    const { error } = await supa.from('transactions').insert({
      id: tx.id,
      user_id: user.id,
      type: tx.type,
      amount: tx.amount,
      note: tx.note,
      date: tx.date
    });
    if (error) { showFlash('⚠️ Error saving', 'out'); }
  }

  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2,6); }

  function getBalance() {
    return data.transactions.reduce((acc, tx) => {
      return tx.type === 'in' ? acc + tx.amount : acc - tx.amount;
    }, 0);
  }

  function getTotalIn() {
    return data.transactions.filter(t => t.type === 'in').reduce((a, t) => a + t.amount, 0);
  }

  function getTotalOut() {
    return data.transactions.filter(t => t.type === 'out').reduce((a, t) => a + t.amount, 0);
  }

  function fmt(n) {
    return n.toFixed(2);
  }

  function render() {
    const balance = getBalance();
    document.getElementById('balanceValue').textContent = fmt(Math.abs(balance));
    const bd = document.getElementById('balanceDisplay');
    bd.querySelector('.balance-currency').textContent = balance < 0 ? '-€' : '€';
    bd.className = 'balance-amount' + (balance < 0 ? ' negative' : '');

    document.getElementById('totalIn').textContent = '€' + fmt(getTotalIn());
    document.getElementById('totalOut').textContent = '€' + fmt(getTotalOut());
    document.getElementById('txCount').textContent = data.transactions.length;

    const list = document.getElementById('logList');
    if (data.transactions.length === 0) {
      list.innerHTML = '<div class="log-empty">No transactions yet</div>';
      return;
    }

    const allTx = [...data.transactions];
    const recent = allTx.map((tx, i) => ({...tx, origIndex: i})).reverse().slice(0, 30);
    list.innerHTML = recent.map(tx => {
      const d = new Date(tx.date);
      const dateStr = d.toLocaleDateString('en-GB', { day: '2-digit', month: 'short' }) +
        ' ' + d.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
      return `
        <div class="log-item-wrap" id="wrap-${tx.origIndex}">
          <div class="log-item-delete-bg">DELETE ✕</div>
          <div class="log-item" id="item-${tx.origIndex}"
            data-index="${tx.origIndex}"
            ontouchstart="swipeStart(event, ${tx.origIndex})"
            ontouchmove="swipeMove(event, ${tx.origIndex})"
            ontouchend="swipeEnd(event, ${tx.origIndex})">
            <div class="log-dot ${tx.type}"></div>
            <div class="log-info">
              <div class="log-type">${tx.type === 'in' ? 'Cash In' : 'Cash Out'}</div>
              <div class="log-date">${dateStr}</div>
              ${tx.note ? `<div class="log-note">${escHtml(tx.note)}</div>` : ''}
            </div>
            <div class="log-amount ${tx.type}">${tx.type === 'in' ? '+' : '-'}€${fmt(tx.amount)}</div>
            <button class="log-edit-btn" onclick="openEditSheet(${tx.origIndex})" title="Edit">✎</button>
            <button class="log-delete-btn" onclick="openDeleteSheet(${tx.origIndex})" title="Delete">✕</button>
          </div>
        </div>`;
    }).join('');
  }

  function escHtml(s) {
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  function openModal(type) {
    currentType = type;
    document.getElementById('amountInput').value = '';
    document.getElementById('noteInput').value = '';
    document.getElementById('modalTitle').textContent = type === 'in' ? 'Cash In' : 'Cash Out';
    document.getElementById('modalTitle').className = 'modal-title ' + type;
    document.getElementById('modalBalance').textContent = 'Current balance: €' + fmt(getBalance());
    const btn = document.getElementById('confirmBtn');
    btn.textContent = type === 'in' ? 'Log Cash In' : 'Log Cash Out';
    btn.className = 'btn-confirm ' + type;
    document.getElementById('modalOverlay').classList.add('open');
    setTimeout(() => document.getElementById('amountInput').focus(), 350);
  }

  function closeModal() {
    document.getElementById('modalOverlay').classList.remove('open');
  }

  function handleOverlayClick(e) {
    if (e.target === document.getElementById('modalOverlay')) closeModal();
  }

  async function confirm() {
    const raw = document.getElementById('amountInput').value;
    const amount = parseFloat(raw);
    if (!raw || isNaN(amount) || amount <= 0) {
      document.getElementById('amountInput').style.borderColor = 'var(--red)';
      setTimeout(() => document.getElementById('amountInput').style.borderColor = '', 1000);
      return;
    }

    if (currentType === 'out' && amount > getBalance()) {
      showFlash('⚠️ Not enough cash in wallet', 'out');
      return;
    }

    const note = document.getElementById('noteInput').value.trim();
    const tx = { id: uid(), type: currentType, amount, note, date: new Date().toISOString() };
    data.transactions.push(tx);
    await save(tx);
    closeModal();
    render();

    const newBalance = getBalance();
    const sign = currentType === 'in' ? '+' : '-';
    showFlash(`${currentType === 'in' ? '✅' : '💸'} ${sign}€${fmt(amount)} → Balance: €${fmt(newBalance)}`, currentType);
  }

  function showFlash(msg, type) {
    const el = document.getElementById('flash');
    el.textContent = msg;
    el.className = 'flash ' + type + ' show';
    setTimeout(() => el.classList.remove('show'), 2800);
  }

  // Swipe to delete
  const swipeState = {};
  const SWIPE_THRESHOLD = 80;

  function swipeStart(e, index) {
    const touch = e.touches[0];
    swipeState[index] = { startX: touch.clientX, startY: touch.clientY, dx: 0, active: true };
  }

  function swipeMove(e, index) {
    const s = swipeState[index];
    if (!s || !s.active) return;
    const touch = e.touches[0];
    const dx = touch.clientX - s.startX;
    const dy = touch.clientY - s.startY;
    if (Math.abs(dy) > Math.abs(dx) && Math.abs(s.dx) < 5) { s.active = false; return; }
    if (dx > 0) return;
    s.dx = dx;
    const el = document.getElementById('item-' + index);
    if (el) {
      el.classList.add('swiping');
      el.style.transform = 'translateX(' + Math.max(dx, -120) + 'px)';
    }
  }

  function swipeEnd(e, index) {
    const s = swipeState[index];
    if (!s) return;
    const el = document.getElementById('item-' + index);
    if (el) {
      el.classList.remove('swiping');
      if (Math.abs(s.dx) > SWIPE_THRESHOLD) {
        el.style.transform = 'translateX(-120px)';
        setTimeout(() => openDeleteSheet(index), 150);
      } else {
        el.style.transform = '';
      }
    }
    delete swipeState[index];
  }

  let pendingDeleteIndex = null;

  function openDeleteSheet(index) {
    pendingDeleteIndex = index;
    const tx = data.transactions[index];
    const d = new Date(tx.date);
    const dateStr = d.toLocaleDateString('en-GB', { day: '2-digit', month: 'short' }) +
      ' ' + d.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
    document.getElementById('deletePreview').innerHTML = `
      <div class="log-dot ${tx.type}" style="flex-shrink:0"></div>
      <div class="log-info">
        <div class="log-type">${tx.type === 'in' ? 'Cash In' : 'Cash Out'}</div>
        <div class="log-date">${dateStr}</div>
        ${tx.note ? `<div class="log-note">${escHtml(tx.note)}</div>` : ''}
      </div>
      <div class="log-amount ${tx.type}">${tx.type === 'in' ? '+' : '-'}€${fmt(tx.amount)}</div>
    `;
    document.getElementById('deleteSheet').classList.add('open');
  }

  function closeDeleteSheet() {
    document.getElementById('deleteSheet').classList.remove('open');
    pendingDeleteIndex = null;
  }

  function handleDeleteOverlayClick(e) {
    if (e.target === document.getElementById('deleteSheet')) closeDeleteSheet();
  }

  async function confirmDelete() {
    if (pendingDeleteIndex === null) return;
    const tx = data.transactions[pendingDeleteIndex];
    const { error } = await supa.from('transactions').delete().eq('id', tx.id);
    if (error) { showFlash('⚠️ Error deleting', 'out'); return; }
    data.transactions.splice(pendingDeleteIndex, 1);
    closeDeleteSheet();
    render();
    showFlash('🗑 Transaction deleted', 'out');
  }

  // ── EDIT TRANSACTION ──
  let pendingEditIndex = null;
  let editType = 'in';

  function setEditType(type) {
    editType = type;
    document.getElementById('editTypeIn').style.opacity = type === 'in' ? '1' : '0.4';
    document.getElementById('editTypeOut').style.opacity = type === 'out' ? '1' : '0.4';
  }

  function openEditSheet(index) {
    pendingEditIndex = index;
    const tx = data.transactions[index];
    editType = tx.type;
    document.getElementById('editAmountInput').value = tx.amount;
    document.getElementById('editNoteInput').value = tx.note || '';
    setEditType(tx.type);
    document.getElementById('editSheet').classList.add('open');
    setTimeout(() => document.getElementById('editAmountInput').focus(), 350);
  }

  function closeEditSheet() {
    document.getElementById('editSheet').classList.remove('open');
    pendingEditIndex = null;
  }

  function handleEditOverlayClick(e) {
    if (e.target === document.getElementById('editSheet')) closeEditSheet();
  }

  async function confirmEdit() {
    if (pendingEditIndex === null) return;
    const raw = document.getElementById('editAmountInput').value;
    const amount = parseFloat(raw);
    if (!raw || isNaN(amount) || amount <= 0) {
      document.getElementById('editAmountInput').style.borderColor = 'var(--red)';
      setTimeout(() => document.getElementById('editAmountInput').style.borderColor = '', 1000);
      return;
    }
    const note = document.getElementById('editNoteInput').value.trim();
    const tx = data.transactions[pendingEditIndex];
    const { error } = await supa.from('transactions').update({ type: editType, amount, note }).eq('id', tx.id);
    if (error) { showFlash('Error saving', 'out'); return; }
    tx.type = editType;
    tx.amount = amount;
    tx.note = note;
    closeEditSheet();
    render();
    showFlash('✅ Transaction updated', 'in');
  }

  function exportCSV() {
    if (data.transactions.length === 0) { showFlash('No data to export', 'out'); return; }
    let csv = 'Date,Type,Amount,Note,Balance\n';
    let running = 0;
    data.transactions.forEach(tx => {
      running += tx.type === 'in' ? tx.amount : -tx.amount;
      const d = new Date(tx.date).toLocaleString('en-GB');
      csv += `"${d}","${tx.type === 'in' ? 'Cash In' : 'Cash Out'}","${tx.amount.toFixed(2)}","${(tx.note||'').replace(/"/g,'""')}","${running.toFixed(2)}"\n`;
    });
    const blob = new Blob([csv], { type: 'text/csv' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'cash_wallet.csv'; a.click();
    URL.revokeObjectURL(url);
    showFlash('📊 CSV exported', 'in');
  }

  // Enter key on inputs
  document.addEventListener('keydown', e => {
    if (e.key === 'Enter') confirm();
    if (e.key === 'Escape') closeModal();
  });

  // ── INIT ──
  document.addEventListener('DOMContentLoaded', async () => {
    const { data: { session } } = await supa.auth.getSession();
    if (session) {
      document.getElementById('viewLogin').style.display = 'none';
      document.getElementById('viewApp').style.display = 'flex';
      await load();
    } else {
      document.getElementById('viewLogin').style.display = 'flex';
    }

    supa.auth.onAuthStateChange(async (event, session) => {
      if (event === 'SIGNED_IN') {
        document.getElementById('viewLogin').style.display = 'none';
        document.getElementById('viewApp').style.display = 'flex';
        await load();
      } else if (event === 'SIGNED_OUT') {
        document.getElementById('viewApp').style.display = 'none';
        document.getElementById('viewLogin').style.display = 'flex';
        data = { transactions: [] };
      }
    });

    document.getElementById('loginPassword').addEventListener('keydown', e => {
      if (e.key === 'Enter') doLogin();
    });
  });
</script>
</body>
</html>
